name: Publish verified certificate images
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-certfix-20261028
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: api
          context: .
          dockerfile: api/Dockerfile
          arguments: --require-certifi
          system_arguments: --require-pip
          system_python: /usr/local/bin/python
          image: dify-api
        - name: agent
          context: .
          dockerfile: dify-agent/Dockerfile
          arguments: --require-certifi
          system_arguments: --require-pip
          system_python: /usr/local/bin/python
          image: dify-agent-backend
        - name: sandbox
          context: dify-agent-runtime
          dockerfile: dify-agent-runtime/docker/Dockerfile
          arguments: ''
          system_arguments: --require-pip
          system_python: /usr/local/bin/python
          image: dify-agent-local-sandbox
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build the runtime image with fresh base layers
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        pull: true
        no-cache: true
        load: true
        push: false
        tags: local/certificate-trust:${{ matrix.name }}
        labels: 'org.opencontainers.image.revision=20e68a956f4c5fd3de689b5fd3fd1989b12972ae

          org.opencontainers.image.source=https://github.com/yoshovski/dify'
    - name: Check application certificate stores and runtime
      run: "docker run --rm --read-only --network none --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint python \\\n  --volume\
        \ \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\" \\\n  local/certificate-trust:${{ matrix.name }} /check.py ${{ matrix.arguments\
        \ }}\n"
    - name: Check the base interpreter and bundled pip trust
      run: "docker run --rm --read-only --network none --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint ${{ matrix.system_python\
        \ }} \\\n  --volume \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\" \\\n  local/certificate-trust:${{ matrix.name }} /check.py\
        \ ${{ matrix.system_arguments }}\n"
    - name: Verify outbound HTTPS rejection with a valid control
      timeout-minutes: 4
      run: "docker run --rm --read-only --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint python \\\n  --volume \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\"\
        \ \\\n  local/certificate-trust:${{ matrix.name }} /check.py --online ${{ matrix.arguments }}\ndocker run --rm --read-only --cap-drop\
        \ ALL \\\n  --security-opt no-new-privileges \\\n  --entrypoint ${{ matrix.system_python }} \\\n  --volume \"$PWD/scripts/check_certificate_trust.py:/check.py:ro\"\
        \ \\\n  local/certificate-trust:${{ matrix.name }} /check.py --online ${{ matrix.system_arguments }}\n"
    - name: Login to GHCR after trust checks pass
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish this exact tested image without changing latest
      env:
        CANDIDATE_IMAGE: ghcr.io/yoshovski/${{ matrix.image }}:1.17.1-internal-v10-certfix-20261028
        TESTED_IMAGE: local/certificate-trust:${{ matrix.name }}
      run: 'docker tag "$TESTED_IMAGE" "$CANDIDATE_IMAGE"

        docker push "$CANDIDATE_IMAGE"

        docker buildx imagetools inspect "$CANDIDATE_IMAGE"

        '
  agent-tests:
    name: Dify v10 agent unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dify-agent
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.4
        python-version: '3.12'
    - run: uv lock --check
    - run: uv sync --frozen --extra server --dev
    - run: uv run --frozen --extra server python -m pytest -q tests/local tests/docs
  web-image:
    name: Dify web Node certificate trust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: web/Dockerfile
        platforms: linux/amd64
        pull: true
        no-cache: true
        load: true
        push: false
        tags: local/certificate-trust:web
        labels: 'org.opencontainers.image.revision=20e68a956f4c5fd3de689b5fd3fd1989b12972ae

          org.opencontainers.image.source=https://github.com/yoshovski/dify'
    - name: Verify Node and OS certificate trust
      run: "docker run --rm --read-only --network none --cap-drop ALL \\\n  --security-opt no-new-privileges --entrypoint node \\\n  --volume\
        \ \"$PWD/scripts/check_node_certificate_trust.cjs:/check.cjs:ro\" \\\n  local/certificate-trust:web /check.cjs\ndocker run --rm --read-only\
        \ --cap-drop ALL \\\n  --security-opt no-new-privileges --entrypoint node \\\n  --volume \"$PWD/scripts/check_node_certificate_trust.cjs:/check.cjs:ro\"\
        \ \\\n  local/certificate-trust:web /check.cjs --online\n"
    - name: Login to GHCR after trust checks pass
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish this exact tested image without changing latest
      env:
        CANDIDATE_IMAGE: ghcr.io/yoshovski/dify-web:1.17.1-internal-v10-certfix-20261028
        TESTED_IMAGE: local/certificate-trust:web
      run: 'docker tag "$TESTED_IMAGE" "$CANDIDATE_IMAGE"

        docker push "$CANDIDATE_IMAGE"

        docker buildx imagetools inspect "$CANDIDATE_IMAGE"

        '
'on':
  push:
    branches:
    - ci/publish-certfix-20261028
